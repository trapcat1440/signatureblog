<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signature & Letter SS Blog - Nothin New</title>

    <link rel="icon" href="https://i.imghippo.com/files/Ngr2023LA.png" type="image/png">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#e0e0e0;
            color:#000;
        }

        /* HEADER */

        header{
            background:#003366;
            color:white;
            display:flex;
            align-items:center;
            padding:15px 20px;
        }

        header img{
            height:60px;
            margin-right:15px;
        }

        header h1{
            font-size:26px;
        }

        /* NAVIGATION */

        nav{
            background:#336699;
            padding:12px 20px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin-right:15px;
            font-weight:bold;
        }

        nav a:hover{
            text-decoration:underline;
        }

        /* MAIN LAYOUT */

        main{
            display:flex;
            max-width:1100px;
            margin:auto;
            padding:20px;
            gap:20px;
        }

        .left-column{
            width:70%;
        }

        .right-column{
            width:30%;
        }

        /* POSTS */

        .post{
            background:white;
            border:1px solid #ccc;
            padding:15px;
            margin-bottom:20px;
        }

        .post h2{
            color:#003366;
            margin-bottom:8px;
        }

        .post h1{
            margin-top:15px;
            color:#222;
        }

        .genre{
            margin-bottom:12px;
            font-size:14px;
        }

        .genre a{
            text-decoration:none;
            color:#336699;
            font-weight:bold;
        }

        .genre a:hover{
            text-decoration:underline;
        }

        /* SIDEBAR */

        .sidebar-box{
            background:white;
            border:1px solid #ccc;
            padding:15px;
        }

        .sidebar-box h3{
            text-align:center;
            color:#003366;
            margin-bottom:15px;
        }

        .shop-thumbnails{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:10px;
        }

        .shop-thumbnails a img{
            width:70px;
            border:1px solid #ccc;
            transition:0.2s;
        }

        .shop-thumbnails a img:hover{
            transform:scale(1.1);
            border-color:#336699;
        }

        /* FOOTER */

        footer{
            background:#003366;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:30px;
            font-size:13px;
        }

        /* MOBILE */

        @media(max-width:768px){

            main{
                flex-direction:column;
            }

            .left-column,
            .right-column{
                width:100%;
            }

            header{
                flex-direction:column;
                text-align:center;
            }

            header img{
                margin-bottom:10px;
            }

        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <header>

    </nav>

    <!-- MAIN CONTENT -->

        <div class="left-column">

                <h2>Building Networks</h2>

                


            </div>

        </div>

        <!-- RIGHT COLUMN -->

        <div class="right-column">

            <div class="sidebar-box">

                <h3>Store Links</h3>

                <div class="shop-thumbnails">

                    <a href="https://amzn.to/4dPdHho" target="_blank">
                        <img src="https://i.imghippo.com/files/xJ2090rpU.png" alt="Shop Item 1">
                    </a>

                    <a href="https://www.jdoqocy.com/click-101756007-17235977" target="_blank">
                        <img src="https://www.lduhtrp.net/image-101756007-17235977" alt="Shop Item 2">
                    </a>

                    <a href="https://www.jdoqocy.com/click-101756007-15640633" target="_blank">
                        <img src="https://www.tqlkg.com/image-101756007-15640633" alt="Shop Item 3">
                    </a>

                    <a href="https://www.fragranceshop.com/" target="_blank">
                        <img src="https://www.fragranceshop.com/wp-content/uploads/2024/06/fs90335.jpg" alt="Shop Item 4">
                    </a>

                    <a href="https://amzn.to/4wGxyXz" target="_blank">
                        <img src="https://i.imghippo.com/files/xJ2090rpU.png" alt="Shop Item 5">
                    </a>

                </div>

            </div>

        </div>

    </main>

    <!-- FOOTER -->

    <footer>

        &copy; 2026 Signature & Letter SS | All Rights Reserved

    </footer>

</body>

</html>
