<style>
.logo-marquee{

    width:100%;

    overflow:hidden;

    padding:25px 0;

    background:
    rgba(255,255,255,.03);

    backdrop-filter:blur(20px);

    border-top:
    1px solid rgba(255,255,255,.12);

    border-bottom:
    1px solid rgba(255,255,255,.12);

    box-shadow:
    0 0 40px rgba(80,120,255,.15);

}


.track{

    display:flex;

    gap:120px;

    width:max-content;

    animation:marquee 45s linear infinite;

}



.track img{

    width:90px;

    height:auto;

    flex-shrink:0;

    opacity:.75;

    filter:
    drop-shadow(0 0 10px rgba(90,140,255,.6))
    drop-shadow(0 0 25px rgba(140,80,255,.4));

    transition:.4s ease;

}



.track img:hover{

    opacity:1;

    transform:scale(1.15);

    filter:
    drop-shadow(0 0 15px #5b7fff)
    drop-shadow(0 0 40px #9333ea);

}



@keyframes marquee{

    from{

        transform:translateX(0);

    }


    to{

        transform:translateX(-50%);

    }

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:"Space Grotesk",Arial,sans-serif;

color:#d6d8e5;

line-height:1.8;

background:
linear-gradient(
180deg,
#050510,
#020207
);

min-height:100vh;

overflow-x:hidden;

position:relative;

}
body::before{

content:"";

position:fixed;

inset:0;

background:

linear-gradient(
rgba(0,255,180,.05) 1px,
transparent 1px
),

linear-gradient(
90deg,
rgba(0,255,180,.05) 1px,
transparent 1px
);

background-size:
40px 40px;

animation:gridMove 8s linear infinite;

pointer-events:none;

z-index:-1;

}


@keyframes gridMove{

from{

transform:translateY(0);

}

to{

transform:translateY(40px);

}

}
body::after{

content:"";

position:fixed;

inset:0;

background:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03),

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 4px

);

pointer-events:none;

opacity:.25;

z-index:10;

}



.container{

max-width:900px;

margin:60px auto;

padding:60px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,.12);

border-radius:24px;

box-shadow:
0 0 80px rgba(80,120,255,.18);

}



h1{

font-size:54px;

color:white;

letter-spacing:3px;

position:relative;

text-shadow:
0 0 15px #00ffcc,
0 0 35px #6366f1;

margin-bottom:15px;

animation:glitch 4s infinite;

}


@keyframes glitch{


0%,90%,100%{

transform:none;

}


92%{

transform:translateX(-3px);

text-shadow:
3px 0 red,
-3px 0 cyan;

}


94%{

transform:translateX(3px);

text-shadow:
-3px 0 red,
3px 0 cyan;

}


96%{

transform:none;

}

}


.updated{

color:#999;

font-size:14px;

margin-bottom:40px;

}



h2{

margin-top:40px;

margin-bottom:15px;

font-size:26px;

color:#79a8ff;

border-bottom:
1px solid rgba(255,255,255,.15);

padding-bottom:8px;

}



p{

margin-bottom:18px;

}



ul{

margin-left:25px;

margin-bottom:20px;

}



li{

margin-bottom:10px;

}



.notice{

padding:20px;

background:rgba(99,102,241,.15);

border-left:3px solid #6366f1;

border-radius:12px;

margin:25px 0;

}



footer{

margin-top:60px;

text-align:center;

color:#888;

font-size:14px;

}



@media(max-width:768px){

.container{

animation:float 6s ease-in-out infinite;

max-width:900px;

h1{

font-size:36px;

}

}
@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-8px);
}

100%{
transform:translateY(0px);
}

}
