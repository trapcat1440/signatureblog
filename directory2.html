<script>
    // Emoji count persistence
    document.querySelectorAll('.post').forEach(post => {
        const postId = post.dataset.id;
        const emojiSpans = post.querySelectorAll('.emoji-container span');

        emojiSpans.forEach(span => {
            const emoji = span.dataset.emoji;
            const savedCount = localStorage.getItem(postId + '-' + emoji);
            if(savedCount) span.querySelector('.emoji-count').textContent = savedCount;

            span.addEventListener('click', () => {
                let count = parseInt(span.querySelector('.emoji-count').textContent) || 0;
                count++;
                span.querySelector('.emoji-count').textContent = count;
                localStorage.setItem(postId + '-' + emoji, count);
            });
        });
    });
</script>
