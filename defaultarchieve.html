<style>

body{
    font-family:Arial, sans-serif;
    background:#f8f1f4;
    text-align:center;
}

h1{
    color:#222;
}

.game{
    width:600px;
    margin:30px auto;
    display:grid;
    grid-template-columns:repeat(4,120px);
    gap:15px;
    justify-content:center;
}

.card{
    width:140px;
    height:170px;
    background:
    linear-gradient(135deg,#111,#444);
    color:white;
    border-radius:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:
    0 10px 25px rgba(0,0,0,.25);
    transition:.5s;
    border:2px solid #c9a227;
}
.card:hover{
    transform:
    translateY(-8px)
    rotate(2deg);
}



.question{
    font-size:20px;
    padding:10px;
}


.answer{
    display:none;
    width:100%;
    height:100%;
}


.answer img{
    width:100%;
    height:110px;
    object-fit:contain;
}


.answer p{
    color:#111;
    font-weight:bold;
    margin:5px;
}


/* When clicked */

.card.open .question,
.card.match .question{
    display:none;
}


.card.open .answer,
.card.match .answer{
    display:block;
    background:white;
}

</style>

</head>

<body>

<h1>Signature & Letter SS blog(Archieve)</h1>

<marquee behavior="scroll" direction="left">
    <span style="color: green;">Inspired.Style.Signed </span>
</marquee>

<div class="game" id="game"></div>

<div class="message" id="message"></div>


<script>

// =====================================
// PASTE YOUR FASHION IMAGE URLS HERE
// Each image must be listed TWICE
// =====================================

const fashionCards = [

{
image:"https://upload.wikimedia.org/wikipedia/commons/0/09/Kith_brand_logo.svg?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=original",
question:"This brand was started by Ronnie Fieg",
answer:"Kith "
},

{
image:"https://upload.wikimedia.org/wikipedia/commons/8/8e/Palm_Angels_logo.svg?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=original",
question:"This brand was founded by Francesco Ragazzi",
answer:"Palm Angels"
},

{
image:"https://upload.wikimedia.org/wikipedia/commons/2/28/Supreme_Logo.svg?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=original",
question:"This logo has a red rectangle  ",
answer:"Supreme"
},

{
image:"https://i.imghippo.com/files/MeMF8837tQ.png",
question:"This brand makes all their clothing in japan",
answer:"Needles"
}

];


// Shuffle cards
fashionCards.sort(()=>Math.random()-0.5);


const game=document.getElementById("game");

let first=null;
let second=null;
let lock=false;
let matches=0;


// Create cards

fashionCards.forEach(cardData=>{

let card=document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="question">
❓<br>
${cardData.question}
</div>

<div class="answer">
<img src="${cardData.image}">
<p>${cardData.answer}</p>
</div>

`;


card.onclick=function(){

if(lock) return;

if(card.classList.contains("open")) return;

if(card.classList.contains("match")) return;


card.classList.add("open");


if(!first){

first=card;

}else{

second=card;

lock=true;


let img1=first.querySelector("img").src;
let img2=second.querySelector("img").src;


if(img1===img2){

first.classList.add("match");
second.classList.add("match");

matches++;

reset();


if(matches===fashionCards.length/2){

document.getElementById("message").innerHTML=
"✨ Fashionista! You matched the collection!";

}


}else{


setTimeout(()=>{

first.classList.remove("open");
second.classList.remove("open");

reset();

},1000);


}


}


};


game.appendChild(card);


});



function reset(){

first=null;
second=null;
lock=false;

}


</script>
